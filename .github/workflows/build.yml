name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render previews (Robolectric)
        id: previews
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*RenderAllTest*' --tests '*UiShotsTest*' 2>&1 | tee test.log

      - name: Build release APK (testing key) and AAB (unsigned, for Play)
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:bundleRelease 2>&1 | tee build.log
          ./gradlew --no-daemon :app:assembleRelease -PtestingSign 2>&1 | tee -a build.log

      - name: Publish outputs to the "builds" branch
        if: always()
        run: |
          mkdir -p out/previews
          cp build.log test.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/zujaj-release.apk 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab out/zujaj-release-unsigned.aab 2>/dev/null || true
          cp app/build/previews/* out/previews/ 2>/dev/null || true
          find app/build/test-results -name "*.xml" -exec cp {} out/ \; 2>/dev/null || true
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > out/STATUS.txt
          cd out
          git init -q -b builds
          git config user.name "zujaj-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
