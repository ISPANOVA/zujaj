name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Saving build minutes (private repo): only build when asked — "[build]" or "[release vX]" in the
# commit message, or the "Run workflow" button. A newer push cancels an older running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render previews (Robolectric)
        id: previews
        if: contains(github.event.head_commit.message, '[previews]')
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*RenderAllTest*' --tests '*UiShotsTest*' --tests '*NavTest*' --tests '*BackScrollTest*' 2>&1 | tee test.log

      - name: Restore upload key from secrets
        env:
          KS: ${{ secrets.ZUJAJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ZUJAJ_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the real upload key"
          else
            echo "No upload key secret – APK uses the testing key, AAB unsigned"
          fi

      - name: Build release APK and AAB
        id: build
        env:
          ZUJAJ_KEYSTORE_PASSWORD: ${{ secrets.ZUJAJ_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease 2>&1 | tee build.log
          ./gradlew --no-daemon :app:assembleRelease -PtestingSign 2>&1 | tee -a build.log
          rm -f "$RUNNER_TEMP/upload.jks" || true

      - name: Show build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "^e: |What went wrong" -A1 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk "release/Zujaj-1.0.0-build${{ github.run_number }}.apk"
          if [ -n "$ZUJAJ_KEYSTORE_FILE" ]; then cp app/build/outputs/bundle/release/*.aab "release/Zujaj-1.0.0-build${{ github.run_number }}-GooglePlay.aab"; fi

      - name: Create GitHub Release (APK for testing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zujaj 1.0.0 · build ${{ github.run_number }}
          prerelease: true
          make_latest: true
          body: |
            ## زجاج – Zujaj (نسخة تجريبية)
            ملف APK للتجربة المباشرة على الموبايل (موقّع بمفتاح تجربة).
            ملف AAB (لو موجود) موقّع بمفتاح الرفع وجاهز للرفع على جوجل بلاي مباشرة.

            Test APK, install directly on Android 8+.
            Commit: ${{ github.sha }}
          files: release/*

      - name: Official release (commit message contains "[release vX.Y.Z]")
        if: contains(github.event.head_commit.message, '[release v')
        run: |
          V=$(echo "${{ github.event.head_commit.message }}" | grep -o '\[release v[0-9a-z.-]*\]' | head -1 | sed 's/\[release //; s/\]//')
          mkdir -p official
          cp release/*.apk "official/Zujaj-${V#v}.apk"
          ls release/*.aab >/dev/null 2>&1 && cp release/*.aab "official/Zujaj-${V#v}-GooglePlay.aab" || true
          echo "VER=$V" >> $GITHUB_ENV

      - name: Publish official release
        if: contains(github.event.head_commit.message, '[release v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          name: زجاج Zujaj ${{ env.VER }} — الإصدار الرسمي
          prerelease: false
          make_latest: true
          body: |
            ## زجاج – Zujaj ${{ env.VER }} — أول إصدار رسمي
            - **APK** للتثبيت المباشر على أي موبايل أندرويد 8 فأحدث.
            - **AAB** موقّع بمفتاح الرفع وجاهز للرفع على جوجل بلاي.

            أكتر من 150 ويدجت للشاشة الرئيسية وشاشة القفل، خطوط ساعات، أرقام عربي/إنجليزي، خط الثلث،
            اشتراك برو (شهري/سنوي/مدى الحياة)، أكواد تفعيل، لوحة تحكم، وحماية من التهكير.
          files: official/*

      - name: Publish outputs to the "builds" branch
        if: always()
        run: |
          mkdir -p out/previews
          cp build.log test.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/zujaj-release.apk 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab out/zujaj-release-unsigned.aab 2>/dev/null || true
          cp app/build/previews/* out/previews/ 2>/dev/null || true
          find app/build/test-results -name "*.xml" -exec cp {} out/ \; 2>/dev/null || true
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > out/STATUS.txt
          cd out
          git init -q -b builds
          git config user.name "zujaj-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
