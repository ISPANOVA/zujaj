name: device

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  device:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[device]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run on emulator (Pixel, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.smrh.zujaj.debug.test/androidx.test.runner.AndroidJUnitRunner > instrument.log 2>&1 || true
            mkdir -p device_out
            adb pull /sdcard/Android/data/com.smrh.zujaj.debug/files/device device_out/ || true
            adb logcat -d -s AndroidRuntime:E > device_out/crash.log || true
            cp instrument.log device_out/ || true
      - name: Publish to "device" branch
        if: always()
        run: |
          mkdir -p device_out
          cd device_out
          git init -q -b device
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "device run ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" device
